<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة تحكم فُرجة</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding-bottom: 48px; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 12px; }
    .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; gap: 8px; height: 56px; padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line); margin-bottom: 16px; }
    .bar .t { font-weight: 700; font-size: 16px; flex: 1; display: flex; align-items: center; gap: 8px; }
    .bar img { width: 28px; height: 28px; }
    .box { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .box h2 { margin: 0 0 12px; font-size: 17px; }
    .hint { color: var(--text-2); font-size: 13px; margin: 0 0 12px; }
    label { display: block; font-size: 13px; color: var(--text-2); margin: 10px 0 6px; }
    input[type=text], input[type=password], input[type=search], textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
      font: inherit; font-size: 16px; padding: 10px 12px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 96px; resize: vertical; direction: ltr; text-align: left; }
    .btn { height: 40px; padding: 0 18px; border-radius: 20px; font-weight: 600; background: var(--chip-active-bg); color: var(--chip-active-text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn.acc { background: var(--accent); color: #fff; }
    .btn.soft { background: var(--surface); color: var(--text); }
    .btn.danger { background: #d92d20; color: #fff; }
    .btn:disabled { opacity: .5; }
    .btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row.end { justify-content: flex-end; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 1em; }
    .msg.bad { color: #e5484d; } .msg.ok { color: #30a46c; }
    .item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .item .th { width: 128px; flex: none; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--skeleton); position: relative; }
    .item .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item .body { flex: 1; min-width: 0; }
    .item .ttl { font-weight: 600; font-size: 14px; line-height: 1.35; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .sub { color: var(--text-2); font-size: 12px; margin-bottom: 8px; }
    .item input[type=text] { font-size: 14px; padding: 8px 10px; margin-bottom: 6px; }
    .warn { color: #e5484d; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .note { color: #f59e0b; font-size: 12px; margin-bottom: 6px; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--surface); margin-inline-start: 6px; }
    .login { max-width: 380px; margin: 12vh auto 0; text-align: center; }
    .login img { width: 64px; height: 64px; margin-bottom: 8px; }
    .login h1 { font-size: 20px; margin: 0 0 4px; }
    .chk { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 12px 0; font-size: 13px; color: var(--text-2); }
    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal .in { width: 100%; max-width: 720px; }
    .modal iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; display: block; }
    .modal .row { margin-top: 12px; justify-content: center; }
    .count { color: var(--text-2); font-weight: 400; font-size: 13px; }
    @media (max-width: 420px) { .item .th { width: 104px; } }
  </style>
  <script src="../config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
